<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SONGIL 손길 – Voice Guide (demo)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
:root{--bg:#F4EEE4;--card:#FFFFFF;--ink:#2E2A26;--muted:#8A8278;--bronze:#A07A4A;--kraft:#C9A97E;--kraftd:#B8956A;--sand:#D9C3A5;--line:#E6DFD3;--accent:#B5533C;--ok:#7E906F;--tray:#E7D6B9;--sticker:#F4EEE4;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1D1915;--card:#2A2520;--ink:#F2EBDD;--muted:#B3A998;--bronze:#D2A86E;--kraft:#9C7F55;--kraftd:#85694A;--sand:#5C4C38;--line:#3A332B;--accent:#E08A72;--ok:#9DB08C;--tray:#4A3E2E;--sticker:#3A332B}}
:root[data-theme="dark"]{--bg:#1D1915;--card:#2A2520;--ink:#F2EBDD;--muted:#B3A998;--bronze:#D2A86E;--kraft:#9C7F55;--kraftd:#85694A;--sand:#5C4C38;--line:#3A332B;--accent:#E08A72;--ok:#9DB08C;--tray:#4A3E2E;--sticker:#3A332B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;min-height:100vh}
body.voiceonly{--bg:#14110E;--card:#201B16;--ink:#FFF7E8;--muted:#CFC4B0;--bronze:#E3B97A;--line:#3A332B}
.app{max-width:520px;margin:0 auto;padding:14px 16px 28px}
.serif{font-family:'Noto Serif KR','Batang',Georgia,serif}
.top{text-align:center;padding:6px 0 4px}
.brand{display:flex;align-items:baseline;justify-content:center;gap:10px}
.brand-name{font-family:'Noto Serif KR',Georgia,serif;font-weight:700;font-size:34px;letter-spacing:.14em;color:var(--bronze)}
.brand-ko{font-family:'Noto Serif KR',Georgia,serif;font-weight:700;font-size:22px}
.slogan{margin:2px 0 12px;font-size:12.5px;color:var(--muted)}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--bronze);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;font-weight:500;padding:8px 14px;min-height:40px;cursor:pointer}
.seg button.on{background:var(--bronze);color:#fff;font-weight:700}
.hero{text-align:center;margin-top:8px}
.hero svg{width:100%;max-width:400px;height:auto;display:block;margin:0 auto}
.hero h1{font-family:'Noto Serif KR',Georgia,serif;font-size:23px;line-height:1.35;margin:6px 0 6px}
.hero p.sub{margin:0 auto 14px;max-width:360px;color:var(--muted);font-size:14px}
.play{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;background:var(--bronze);color:#fff;font:inherit;font-size:18px;font-weight:700;padding:16px 34px;min-height:58px;cursor:pointer;box-shadow:0 8px 22px rgba(160,122,74,.35);animation:beat 2.2s ease-in-out infinite}
.play:active{transform:scale(.97)}
.link{display:block;margin:12px auto 0;background:transparent;border:0;color:var(--bronze);font:inherit;font-size:14px;font-weight:700;text-decoration:underline;padding:10px;min-height:44px;cursor:pointer}
.how{display:flex;justify-content:center;gap:8px;margin:16px 0 4px;flex-wrap:wrap}
.how span{font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.demo{margin:16px auto 0;max-width:420px;padding:10px 14px;border:1px dashed var(--bronze);border-radius:14px;font-size:12.5px;color:var(--muted);background:var(--card)}
.demo b{color:var(--accent)}
.stage{margin-top:8px}
.stage[hidden]{display:none}
.stage.show{animation:rise .6s ease both}
.tray{display:grid;gap:6px;background:var(--tray);border:3px solid var(--kraftd);border-radius:18px;padding:8px}
.zone{background:rgba(255,255,255,.35);border-radius:12px;padding:6px 3px 8px;text-align:center;transition:opacity .4s,transform .35s,box-shadow .35s,background .35s;cursor:pointer;border:2px solid transparent;min-width:0}
.zone{opacity:.55}
.stage.show .zone{animation:zin .5s ease backwards;animation-delay:calc(var(--z)*110ms)}
.zone.done{opacity:.85}
.zone.active{opacity:1!important;transform:translateY(-5px)!important;background:var(--card);border-color:var(--bronze);box-shadow:0 8px 18px rgba(0,0,0,.18)}
.stage.show .zone.active{animation:pulse 1.6s ease-out infinite;animation-delay:0s}
.zone .n{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--bronze);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center}
.zone .zl{font-size:11px;font-weight:700;margin:3px 0 5px;line-height:1.2;word-break:keep-all}
.mini{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 2px;margin-top:4px;font-size:9.5px;line-height:1.15;word-break:keep-all}
.mini svg{width:22px;height:22px}
.mini em{font-style:normal;color:var(--muted);font-size:9px}
.detail{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 12px 6px}
.dh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dh .n{width:28px;height:28px;border-radius:50%;background:var(--bronze);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.dh h2{font-family:'Noto Serif KR',Georgia,serif;font-size:19px;margin:0}
.dh small{display:block;color:var(--muted);font-size:12px}
.row{display:flex;align-items:center;gap:12px;padding:9px 6px;border-top:1px solid var(--line);border-radius:12px;cursor:pointer;transition:background .3s,transform .3s}
.row.active{background:rgba(160,122,74,.16);transform:scale(1.02)}
.sticker{flex:none;width:56px;height:56px;border-radius:50%;background:var(--sticker);border:2px solid var(--bronze);display:flex;align-items:center;justify-content:center;position:relative}
.row.active .sticker::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--bronze);animation:ripple 1.2s ease-out infinite}
.sticker svg{width:40px;height:40px;overflow:visible}
.rt{flex:1;min-width:0}
.rt b{font-size:16px;display:block}
.rt span{font-size:12.5px;color:var(--muted);display:block}
.rt i{font-style:normal;font-size:12.5px;color:var(--bronze);font-weight:700}
.qty{flex:none;font-weight:700;font-size:15px;color:var(--bronze);background:var(--sticker);border:1px solid var(--bronze);border-radius:999px;padding:3px 11px}
.s{transform-box:fill-box;transform-origin:center}
.row.active .s,.sticker.hit .s{animation:pop .55s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*80ms)}
.row.active .wv,.sticker.hit .wv{animation:dash 1s ease both}
.caption{margin-top:14px;min-height:92px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--bronze);border-radius:14px;padding:12px 14px;position:relative}
.caption .main{font-size:20px;font-weight:700;line-height:1.35}
.caption .alt{font-size:13px;color:var(--muted);margin-top:4px}
.caption .main.fade{animation:fade .45s ease both}
.eq{position:absolute;right:12px;top:12px;display:flex;gap:3px;align-items:flex-end;height:20px}
.eq i{width:4px;height:20%;background:var(--bronze);border-radius:2px}
.speaking .eq i{animation:eq .8s ease-in-out infinite}
.speaking .eq i:nth-child(2){animation-delay:.15s}.speaking .eq i:nth-child(3){animation-delay:.3s}.speaking .eq i:nth-child(4){animation-delay:.45s}
.controls{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:12px}
.btn{border:1.5px solid var(--bronze);background:var(--card);color:var(--ink);border-radius:999px;font:inherit;font-weight:700;min-width:52px;min-height:52px;padding:0 16px;font-size:18px;cursor:pointer}
.btn.main{background:var(--bronze);color:#fff;min-width:130px;font-size:16px}
.btn:active{transform:scale(.96)}
.progress{height:6px;background:var(--line);border-radius:6px;margin-top:12px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--bronze);transition:width .5s}
.note{margin-top:10px;font-size:12.5px;color:var(--accent);text-align:center}
.foot{margin-top:22px;text-align:center;font-size:12px;color:var(--muted)}
.foot b{color:var(--bronze)}
.voiceonly .tray,.voiceonly .detail,.voiceonly .hero svg,.voiceonly .how{display:none}
.voiceonly .caption .main{font-size:30px}.voiceonly .caption .alt{font-size:18px}
.voiceonly .btn{min-height:68px;min-width:68px;font-size:24px}.voiceonly .btn.main{min-width:170px}
.voiceonly .play{font-size:24px;padding:22px 40px}
.box .lid{transition:transform 1s cubic-bezier(.5,0,.2,1),opacity .8s;transform-box:fill-box;transform-origin:left bottom}
.box.open .lid{transform:translateY(-72px) rotate(-7deg);opacity:0}
.whale{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 3.2s ease .4s forwards}
.tag{transform-box:fill-box;transform-origin:50% 0;animation:swing 3.4s ease-in-out infinite}
.sp{animation:twinkle 2.4s ease-in-out infinite}.sp:nth-of-type(2){animation-delay:.6s}.sp:nth-of-type(3){animation-delay:1.2s}.sp:nth-of-type(4){animation-delay:1.8s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes zin{from{opacity:0;transform:translateY(16px)}to{opacity:.55;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(160,122,74,.5)}100%{box-shadow:0 0 0 14px rgba(160,122,74,0)}}
@keyframes ripple{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
@keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes dash{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes eq{0%,100%{height:20%}50%{height:100%}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.whale{stroke-dashoffset:0}}
</style>
</head>

</div>
<script>
(function(){

 ko:{title:"상자 속을 목소리로 안내해 드려요",sub:"버튼을 누르면 상자 안에 무엇이 들어 있는지 차례로 들려드려요.",play:"▶ 눌러서 듣기",voiceOnly:"눈 감고 듣기 모드",stop:"■ 멈춤",replay:"↺ 다시 듣기",close:"상자 닫기",how:["① QR 스캔","② 버튼 누르기","③ 듣기"],demo:"<b>데모 버전</b> – 지금 목소리는 휴대폰 기본 음성이에요. 팀이 직접 녹음한 목소리는 이번 주에 넣을 예정이에요.",foot:"<b>SONGIL 손길</b> · Team A Plus · 울산과학대학교<br>점자 스티커와 직접 녹음한 음성 안내가 이번 주 추가돼요.",nosound:"소리가 안 나면 음량을 올리고 무음 모드를 꺼 주세요. 자막으로도 볼 수 있어요.",nospeech:"이 휴대폰은 음성 읽기를 지원하지 않아요. 자막으로 안내해 드려요.",tapHint:"칸이나 제품을 누르면 그 설명만 들려줘요.",kitDuo:"DUO 2인 세트",kitSolo:"SOLO 1인 키트"},

 shampoo:{ko:"샴푸",en:"Shampoo",sym:"lines",symKo:"세로 선 네 개",symEn:"four raised lines",tKo:"샴푸는 세로 선 네 개예요.",tEn:"Shampoo has four raised lines."},
 conditioner:{ko:"린스",en:"Conditioner",sym:"dots",symKo:"점 두 줄",symEn:"two rows of dots",tKo:"린스는 점 두 줄이에요.",tEn:"Conditioner has two rows of dots."},
 bodywash:{ko:"바디워시",en:"Body wash",sym:"wave",symKo:"물결 하나",symEn:"one wave",tKo:"바디워시는 물결 하나예요.",tEn:"Body wash has one wave."},
 soap:{ko:"비누",en:"Soap",sym:"round",symKo:"동그란 모양",symEn:"round shape",tKo:"비누는 동그란 모양이에요.",tEn:"The soap is round."},
 towel:{ko:"샤워타올",en:"Shower towel",sym:"pouch",symKo:"작은 파우치",symEn:"small pouch",tKo:"샤워타올도 있어요.",tEn:"And a shower towel."},
 toner:{ko:"토너",en:"Toner",sym:"ring1",symKo:"동그라미 하나",symEn:"one ring",tKo:"토너는 동그라미 하나예요.",tEn:"Toner has one ring."},

 foam:{ko:"폼클렌징",en:"Foam cleansing",sym:"ring3",symKo:"동그라미 셋",symEn:"three rings",tKo:"폼클렌징은 동그라미 셋이에요.",tEn:"Foam cleansing has three rings."},
 toothbrush:{ko:"칫솔·치약 세트",en:"Toothbrush & toothpaste",sym:"long",symKo:"길쭉한 포장",symEn:"long pack",tKo:"칫솔과 치약 세트예요.",tEn:"A toothbrush and toothpaste set."},
 comb:{ko:"빗",en:"Comb",sym:"comb",symKo:"납작하고 긴 포장",symEn:"flat, long pack",tKo:"빗이에요.",tEn:"And a comb."},
 care:{ko:"레이디 세트",en:"Lady care kit",sym:"pouch",symKo:"작은 파우치",symEn:"small pouch",tKo:"레이디 세트예요.",tEn:"A lady care kit."}
};
var ORD={ko:["첫째","둘째","셋째","넷째","다섯째"],en:["First","Second","Third","Fourth","Fifth"]};
var KITS={
 duo:{n:5,zones:[
  {k:"hair",ko:"머리",en:"Hair",items:["shampoo","conditioner"],q:2},
  {k:"body",ko:"몸",en:"Body",items:["bodywash","soap","towel"],q:2},
  {k:"face",ko:"얼굴",en:"Face",items:["toner","essence","foam"],q:1},
  {k:"teeth",ko:"치아와 빗",en:"Teeth & comb",items:["toothbrush","comb"],q:2},
  {k:"care",ko:"레이디 세트",en:"Care kit",items:["care"],q:1}]},
 solo:{n:4,zones:[
  {k:"hair",ko:"머리",en:"Hair",items:["shampoo","conditioner"],q:1},
  {k:"body",ko:"몸",en:"Body",items:["bodywash","soap","towel"],q:1},
  {k:"face",ko:"얼굴",en:"Face",items:["toner","essence","foam"],q:1},
  {k:"tc",ko:"치아·빗·관리",en:"Teeth & care",items:["toothbrush","comb","care"],q:1}]}
};
var state={kit:"duo",lang:"ko",steps:[],cur:-1,playing:false,run:0,timers:[],started:false,voices:[],voiceOnly:false,zone:0};
var $=function(id){return document.getElementById(id)};
var hasTTS=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);

/* ---------- symbols ---------- */
function symSVG(t){
 var s='<svg viewBox="0 0 40 40" aria-hidden="true" fill="none" stroke="#A07A4A" stroke-width="3" stroke-linecap="round">',i;
 if(t==="lines"){for(i=0;i<4;i++)s+='<line class="s" style="--i:'+i+'" x1="'+(9+i*7.4)+'" y1="8" x2="'+(9+i*7.4)+'" y2="32"/>';}
 else if(t==="dots"){var n=0,r,c;for(r=0;r<2;r++)for(c=0;c<4;c++){s+='<circle class="s" style="--i:'+(n++)+'" cx="'+(9+c*7.4)+'" cy="'+(14+r*12)+'" r="2.7" fill="#A07A4A" stroke="none"/>';}}
 else if(t==="wave"){s+='<path class="wv" pathLength="1" style="stroke-dasharray:1" d="M5 20 C10 8 15 8 20 20 S30 32 35 20"/>';}
 else if(t==="ring1"){s+='<circle class="s" style="--i:0" cx="20" cy="20" r="9"/>';}
 else if(t==="ring2"){s+='<circle class="s" style="--i:0" cx="12" cy="20" r="7"/><circle class="s" style="--i:1" cx="28" cy="20" r="7"/>';}
 else if(t==="ring3"){s+='<circle class="s" style="--i:0" cx="8" cy="20" r="5.2"/><circle class="s" style="--i:1" cx="20" cy="20" r="5.2"/><circle class="s" style="--i:2" cx="32" cy="20" r="5.2"/>';}
 else if(t==="round"){s+='<circle class="s" style="--i:0" cx="20" cy="20" r="11" fill="#D9C3A5"/><circle class="s" style="--i:1" cx="20" cy="20" r="5" stroke-width="2"/>';}
 else if(t==="long"){s+='<rect class="s" style="--i:0" x="6" y="15" width="28" height="10" rx="4" fill="#D9C3A5"/>';}
 else if(t==="comb"){s+='<rect class="s" style="--i:0" x="6" y="13" width="28" height="7" rx="2" fill="#D9C3A5"/>';for(i=0;i<5;i++)s+='<line class="s" style="--i:'+(i+1)+'" x1="'+(9+i*5.5)+'" y1="21" x2="'+(9+i*5.5)+'" y2="29" stroke-width="2.2"/>';}
 else {s+='<rect class="s" style="--i:0" x="9" y="9" width="22" height="22" rx="5" fill="#D9C3A5"/><line class="s" style="--i:1" x1="9" y1="15" x2="31" y2="15" stroke-width="2"/>';}
 return s+'</svg>';
}
function qtyKo(q){return q===1?"한 개":"두 개";}
function qtyEn(q){return q===1?"one":"two";}

/* ---------- steps ---------- */
function buildSteps(){
 var k=KITS[state.kit],st=[],zi,ii,z,it;
 st.push({z:-1,it:-1,ko:"안녕하세요, 손길입니다. "+(state.kit==="duo"?"이 상자는 왼쪽에서 오른쪽으로 다섯 칸이에요.":"이 키트는 네 칸이에요."),en:"Hello, this is SONGIL. "+(state.kit==="duo"?"Your box has five sections, from left to right.":"Your kit has four sections.")});
 for(zi=0;zi<k.zones.length;zi++){
  z=k.zones[zi];
  if(z.items.length===1){
   st.push({z:zi,it:0,ko:ORD.ko[zi]+" 칸에는 "+ITEMS[z.items[0]].ko+"가 "+qtyKo(z.q)+" 들어 있어요.",en:ORD.en[zi]+", "+qtyEn(z.q)+" "+ITEMS[z.items[0]].en.toLowerCase()+"."});
   continue;
  }
  var zko={hair:"머리예요.",body:"몸이에요.",face:"얼굴이에요.",teeth:"치아와 빗이에요.",tc:"치아와 관리예요."}[z.k];
  var zen={hair:"hair.",body:"body.",face:"face.",teeth:"teeth and comb.",tc:"teeth and care."}[z.k];
  st.push({z:zi,it:-1,ko:ORD.ko[zi]+" 칸은 "+zko,en:ORD.en[zi]+", "+zen});
  for(ii=0;ii<z.items.length;ii++){it=ITEMS[z.items[ii]];st.push({z:zi,it:ii,ko:it.tKo,en:it.tEn});}
  st.push({z:zi,it:-1,ko:(z.k==="teeth"||z.k==="tc"?"모두 ":"각각 ")+qtyKo(z.q)+"씩"+(z.k==="teeth"||z.k==="tc"?"이에요.":" 들어 있어요."),en:(qtyEn(z.q)==="one"?"One of each.":"Two of each.")});
 }
 st.push({z:-2,it:-1,ko:"모든 제품에는 점자 스티커도 붙어 있어요. 편안한 여행 되세요.",en:"Every item also has a braille label. Have a lovely trip."});
 state.steps=st;
}

/* ---------- rendering ---------- */
function t(key){return UI[state.lang][key];}
function renderStatic(){
 var u=UI[state.lang];
 document.documentElement.lang=state.lang;
 $("heroTitle").textContent=u.title;$("heroSub").textContent=u.sub;
 $("playBtn").textContent=u.play;$("voiceOnlyBtn").textContent=state.voiceOnly?(state.lang==="ko"?"보통 모드로":"Normal mode"):u.voiceOnly;
 $("how").innerHTML=u.how.map(function(x){return "<span>"+x+"</span>"}).join("");
 $("demoNote").innerHTML=u.demo;$("foot").innerHTML=u.foot;$("closeBtn").textContent=u.close;
 $("toggleBtn").textContent=state.playing?u.stop:(state.cur>=state.steps.length-1&&state.cur>=0?u.replay:u.play);
 $("prevBtn").setAttribute("aria-label",state.lang==="ko"?"이전 칸":"Previous section");$("nextBtn").setAttribute("aria-label",state.lang==="ko"?"다음 칸":"Next section");
}
function renderTray(){
 var k=KITS[state.kit],h="";
 $("tray").style.gridTemplateColumns="repeat("+k.zones.length+",minmax(0,1fr))";
 k.zones.forEach(function(z,i){
  h+='<div class="zone" data-z="'+i+'" style="--z:'+i+'" role="button" tabindex="0" aria-label="'+z.ko+' '+z.en+'"><span class="n">'+(i+1)+'</span><div class="zl">'+(state.lang==="ko"?z.ko:z.en)+'</div>';
  z.items.forEach(function(key){var it=ITEMS[key];h+='<div class="mini">'+symSVG(it.sym)+'<span>'+(state.lang==="ko"?it.ko:it.en)+'</span><em>×'+z.q+'</em></div>';});
  h+='</div>';
 });
 $("tray").innerHTML=h;
}
function renderDetail(zi,active){
 var k=KITS[state.kit],z=k.zones[zi],h="";
 if(!z){$("detail").innerHTML='<div class="dh"><div class="n">♪</div><div><h2>'+(state.lang==="ko"?"손길 음성 안내":"SONGIL voice guide")+'</h2><small>'+t("tapHint")+'</small></div></div>';return;}
 h+='<div class="dh"><div class="n">'+(zi+1)+'</div><div><h2>'+z.ko+'</h2><small>'+z.en+'</small></div></div>';
 z.items.forEach(function(key,i){
  var it=ITEMS[key];
  h+='<div class="row'+(i===active?' active':'')+'" data-it="'+i+'" role="button" tabindex="0"><div class="sticker">'+symSVG(it.sym)+'</div><div class="rt"><b>'+it.ko+'</b><span>'+it.en+'</span><i>'+(state.lang==="ko"?it.symKo:it.symEn)+'</i></div><div class="qty">×'+z.q+'</div></div>';
 });
 $("detail").innerHTML=h;
}
function setZoneClasses(zi){
 var els=document.querySelectorAll(".zone");
 Array.prototype.forEach.call(els,function(el,i){el.classList.toggle("active",i===zi);el.classList.toggle("done",zi>=0&&i<zi);});
}
function caption(ko,en){
 var main=$("capMain"),alt=$("capAlt");
 var a=state.lang==="ko"?ko:en,b=state.lang==="ko"?en:ko;
 main.classList.remove("fade");void main.offsetWidth;main.textContent=a;main.classList.add("fade");alt.textContent=b;
}
function showStep(i){
 var s=state.steps[i];if(!s)return;
 state.cur=i;
 var zi=s.z>=0?s.z:-1;
 if(zi>=0){state.zone=zi;renderDetail(zi,s.it>=0?s.it:-1);}
 else if(s.z===-1){renderDetail(-1,-1);}
 setZoneClasses(s.z===-2?KITS[state.kit].zones.length:zi);
 caption(s.ko,s.en);
 $("bar").style.width=Math.round((i+1)/state.steps.length*100)+"%";
 $("toggleBtn").textContent=state.playing?t("stop"):((i>=state.steps.length-1)?t("replay"):t("play"));
}

/* ---------- speech ---------- */
function loadVoices(){if(hasTTS){try{state.voices=window.speechSynthesis.getVoices()||[];}catch(e){state.voices=[];}}}
function pickVoice(lang){
 var p=lang==="ko"?"ko":"en",list=state.voices.filter(function(v){return (v.lang||"").toLowerCase().replace("_","-").indexOf(p)===0;});
 if(!list.length)return null;
 var pref=lang==="ko"?/ko-kr/i:/en-(us|gb|au)/i;
 return list.filter(function(v){return pref.test(v.lang||"");})[0]||list[0];
}
function clearTimers(){state.timers.forEach(function(x){clearTimeout(x)});state.timers=[];}
function stopAll(){state.run++;clearTimers();if(hasTTS){try{window.speechSynthesis.cancel();}catch(e){}}state.playing=false;$("captionBox").classList.remove("speaking");$("toggleBtn").textContent=(state.cur>=state.steps.length-1&&state.cur>=0)?t("replay"):t("play");}
function finish(run){if(run!==state.run)return;state.playing=false;$("captionBox").classList.remove("speaking");setZoneClasses(KITS[state.kit].zones.length);$("toggleBtn").textContent=t("replay");}
function note(msg){var n=$("note");if(msg){n.textContent=msg;n.hidden=false;}else{n.hidden=true;}}
function playFrom(i){
 stopAll();
 var run=state.run;state.playing=true;state.started=false;$("toggleBtn").textContent=t("stop");note("");
 if(!hasTTS){note(t("nospeech"));timerPlay(i,run);return;}
 var v=pickVoice(state.lang),lang=state.lang==="ko"?"ko-KR":"en-US",j;
 for(j=i;j<state.steps.length;j++){(function(idx){
  var u=new window.SpeechSynthesisUtterance(state.lang==="ko"?state.steps[idx].ko:state.steps[idx].en);
  u.lang=lang;if(v)u.voice=v;u.rate=state.lang==="ko"?0.95:0.92;u.pitch=1;
  u.onstart=function(){if(run!==state.run)return;state.started=true;$("captionBox").classList.add("speaking");showStep(idx);};
  u.onend=function(){if(run!==state.run)return;if(idx===state.steps.length-1)finish(run);};
  u.onerror=function(){};
  window.speechSynthesis.speak(u);
 })(j);}
 showStep(i);
 state.timers.push(setTimeout(function(){
  if(run!==state.run||state.started||!state.playing)return;
  try{window.speechSynthesis.cancel();}catch(e){}
  note(t("nospeech"));timerPlay(i,run);
 },2800));
 }
function timerPlay(i,run){
 if(run!==state.run)return;
 if(i>=state.steps.length){finish(run);return;}
 showStep(i);$("captionBox").classList.add("speaking");
 var s=state.steps[i],txt=state.lang==="ko"?s.ko:s.en,ms=Math.max(2300,txt.length*(state.lang==="ko"?170:80));
 state.timers.push(setTimeout(function(){timerPlay(i+1,run);},ms));
}
function speakOne(text,lang){
 stopAll();if(!hasTTS)return;
 var u=new window.SpeechSynthesisUtterance(text),v=pickVoice(lang);u.lang=lang==="ko"?"ko-KR":"en-US";if(v)u.voice=v;u.rate=0.95;
 u.onstart=function(){$("captionBox").classList.add("speaking");};u.onend=function(){$("captionBox").classList.remove("speaking");};
 window.speechSynthesis.speak(u);
}
function firstStepOfZone(zi){for(var i=0;i<state.steps.length;i++){if(state.steps[i].z===zi)return i;}return 0;}
function jumpZone(dir){
 var k=KITS[state.kit],cur=state.steps[Math.max(state.cur,0)],zi=cur?cur.z:-1,target;
 if(cur&&cur.z===-2)zi=k.zones.length;
 target=Math.min(Math.max(zi+dir,-1),k.zones.length);
 var idx=target<0?0:(target>=k.zones.length?state.steps.length-1:firstStepOfZone(target));
 if(state.playing)playFrom(idx);else showStep(idx);
}

/* ---------- open / close ---------- */
function unlock(){if(!hasTTS)return;try{var u=new window.SpeechSynthesisUtterance(" ");u.volume=0;window.speechSynthesis.speak(u);}catch(e){}}
function openBox(){
 unlock();$("boxsvg").classList.add("open");
 setTimeout(function(){
  $("hero").hidden=true;$("stage").hidden=false;$("stage").classList.add("show");
  state.cur=-1;renderTray();renderDetail(-1,-1);setZoneClasses(-1);
  playFrom(0);
 },state.voiceOnly?50:850);
}
function closeBox(){
 stopAll();state.cur=-1;$("stage").classList.remove("show");$("stage").hidden=true;$("hero").hidden=false;$("boxsvg").classList.remove("open");note("");$("bar").style.width="0";
 renderStatic();
}
function rebuild(){
 var wasOpen=!$("stage").hidden;stopAll();buildSteps();renderStatic();
 if(wasOpen){renderTray();renderDetail(-1,-1);setZoneClasses(-1);state.cur=-1;$("bar").style.width="0";caption(state.lang==="ko"?"버튼을 눌러 다시 들어보세요.":"Press play to listen again.",state.lang==="ko"?"Press play to listen again.":"버튼을 눌러 다시 들어보세요.");}
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
 var el=e.target;
 var kit=el.closest&&el.closest("[data-kit]");if(kit){state.kit=kit.getAttribute("data-kit");Array.prototype.forEach.call(document.querySelectorAll("[data-kit]"),function(b){b.classList.toggle("on",b===kit)});rebuild();return;}
 var lg=el.closest&&el.closest("[data-lang]");if(lg){state.lang=lg.getAttribute("data-lang");Array.prototype.forEach.call(document.querySelectorAll("[data-lang]"),function(b){b.classList.toggle("on",b===lg)});rebuild();return;}
 var z=el.closest&&el.closest(".zone");if(z){var zi=+z.getAttribute("data-z");state.zone=zi;renderDetail(zi,-1);setZoneClasses(zi);var s0=state.steps[firstStepOfZone(zi)];caption(s0.ko,s0.en);speakOne(state.lang==="ko"?s0.ko:s0.en,state.lang);return;}
 var r=el.closest&&el.closest(".row");if(r){var ii=+r.getAttribute("data-it"),key=KITS[state.kit].zones[state.zone].items[ii],it=ITEMS[key];renderDetail(state.zone,ii);caption(it.tKo,it.tEn);speakOne(state.lang==="ko"?it.tKo:it.tEn,state.lang);return;}
});
document.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target&&(e.target.classList.contains("zone")||e.target.classList.contains("row"))){e.preventDefault();e.target.click();}});
$("playBtn").addEventListener("click",openBox);
$("voiceOnlyBtn").addEventListener("click",function(){state.voiceOnly=!state.voiceOnly;document.body.classList.toggle("voiceonly",state.voiceOnly);renderStatic();});
$("closeBtn").addEventListener("click",closeBox);
$("toggleBtn").addEventListener("click",function(){unlock();if(state.playing){stopAll();return;}var from=(state.cur>=state.steps.length-1||state.cur<0)?0:state.cur;playFrom(from);});
$("prevBtn").addEventListener("click",function(){jumpZone(-1);});
$("nextBtn").addEventListener("click",function(){jumpZone(1);});
window.addEventListener("pagehide",stopAll);

/* ---------- init ---------- */
if(hasTTS){loadVoices();if("onvoiceschanged" in window.speechSynthesis){window.speechSynthesis.onvoiceschanged=loadVoices;}}
var tokens=(location.hash||"").toLowerCase().replace("#","").split(/[^a-z]+/);
if(tokens.indexOf("solo")>-1){state.kit="solo";}
if(tokens.indexOf("en")>-1){state.lang="en";}
Array.prototype.forEach.call(document.querySelectorAll("[data-kit]"),function(b){b.classList.toggle("on",b.getAttribute("data-kit")===state.kit)});
Array.prototype.forEach.call(document.querySelectorAll("[data-lang]"),function(b){b.classList.toggle("on",b.getAttribute("data-lang")===state.lang)});
buildSteps();renderStatic();
window.__songil={state:state,buildSteps:buildSteps,playFrom:playFrom,openBox:openBox};
})();
</script>
